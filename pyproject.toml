[project]
name = "nix2rle"
version = "0.1.0"
description = "Declare reproducible learning environments in Nix and run them as Harbor tasks"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["pydantic", "pyyaml", "zstandard"]

[project.optional-dependencies]
harbor = ["harbor==0.23.0"]

[project.scripts]
nix2rle = "nix2rle.cli:main"
nix2rle-pin-base = "nix2rle.authoring.pin_base:main"
nix2rle-lock-packages = "nix2rle.authoring.packages:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
src = ["src", "builders", "."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Builder tests load the standalone builder scripts by path.
"tests/**/*.py" = ["E402"]
