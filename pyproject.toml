[project]
name = "mango"
version = "0.1.0"
description = "Declare reproducible learning environments in Nix and run them as Harbor tasks"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["pydantic", "pyyaml", "zstandard"]

[project.optional-dependencies]
harbor = ["harbor==0.23.0"]

[project.scripts]
mango = "mango.cli:main"
mango-pin-base = "mango.authoring.pin_base:main"
mango-pin-source = "mango.authoring.pin_source:main"
mango-pin-file = "mango.authoring.pin_file:main"
mango-lock-packages = "mango.authoring.packages:main"
mango-lock-python = "mango.authoring.python_lock:main"
mango-lock-rustup = "mango.authoring.rustup_lock:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
src = ["src", "builders", "."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Builder tests load the standalone builder scripts by path.
"tests/**/*.py" = ["E402"]
