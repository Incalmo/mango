name: Dependency adapters
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
      - run: nix-shell --run 'python -m unittest discover -s tests -t . -p "test_*.py" -v'
      - name: Verify offline rebuild in an isolated store
        run: |
          # Ubuntu's AppArmor policy blocks the Nix-provided unshare binary.
          # Allow user namespaces only for this check on the disposable runner;
          # retain Nix sandboxing and the fixture's network namespace isolation.
          key=kernel.apparmor_restrict_unprivileged_userns
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            previous=$(sysctl -n "$key")
            trap 'sudo sysctl -w "$key=$previous"' EXIT
            sudo sysctl -w "$key=0"
          fi
          nix-shell --run 'unshare -Urnm true && bash tests/support/check-cache-offline-fixture.sh'
      - run: nix-shell --run 'ruff check src builders tests'
